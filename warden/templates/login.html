<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Inbox Warden</title>
  <link rel="icon" href="/static/logo.svg?v=2">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<div class="login">
  <form class="card" method="post" action="/login">
    <img src="/static/logo.svg?v=2" alt="">
    <h2 style="margin:14px 0 4px">Inbox Warden</h2>
    <p class="muted" style="margin:0 0 18px">Sign in to manage your mailboxes.</p>
    {% if error %}<div class="notice red">Wrong password.</div>{% endif %}
    <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autofocus></div>
    <button class="btn" style="width:100%;justify-content:center">Sign in</button>
  </form>
</div>
</body>
</html>

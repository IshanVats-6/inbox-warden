<!doctype html>
{# All UI follows DESIGN.md (Notion system). #}
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Inbox Warden</title>
  <link rel="icon" href="/static/logo.svg?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
<main class="login">
  <form class="card" method="post" action="/login">
    <img src="/static/logo.svg?v=3" alt="">
    <h1>Sign in to Inbox Warden</h1>
    <p>Manage your mailboxes, labels and runs.</p>
    {% if error %}<div class="notice error" role="alert">That password didn't match. Try again.</div>{% endif %}
    <div class="field"><label class="lbl" for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" autofocus required></div>
    <button class="btn w100">Sign in</button>
  </form>
</main>
</body>
</html>
